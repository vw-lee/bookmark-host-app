# Task 6a/6b — fill in titles, descriptions and favicons after a commit.
#
# This workflow belongs in the DATA repository (the private one holding bookmarks.json),
# not in the app repository. Copy it there along with scripts/.
name: Enrich bookmarks

on:
  push:
    branches: [main]
    paths: ["data/bookmarks.json"]
  workflow_dispatch:

permissions:
  contents: write

# Task 6b — loop guard. Without this the enrichment commit retriggers the workflow, which
# enriches nothing, commits nothing, and still burns a run every time. `paths` above is not
# sufficient on its own because the enrichment commit touches exactly that file.
concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    # Second half of the loop guard: skip anything this workflow itself committed.
    if: "!contains(github.event.head_commit.message, '[enrich]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch metadata
        run: node scripts/enrich.mjs data/bookmarks.json

      - name: Commit enrichment
        run: |
          if git diff --quiet -- data/bookmarks.json; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bookmarks.json
          git commit -m "chore: enrich bookmark metadata [enrich]"
          git push
